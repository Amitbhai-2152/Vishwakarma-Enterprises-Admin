<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GitHub Authorization — Vishwakarma Enterprises</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="card"><span class="eyebrow">GITHUB AUTHORIZATION</span><h1>Finishing sign-in…</h1><p id="status">Securing your GitHub authorization and returning to the Admin panel.</p></section></main><script src="admin-config.js"></script><script>
const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);const code=qs.get('code'),state=qs.get('state'),error=qs.get('error');
async function finish(){try{if(error)throw new Error(qs.get('error_description')||error);const expected=sessionStorage.getItem('ve-oauth-state'),verifier=sessionStorage.getItem('ve-oauth-verifier');if(!code||!state||!expected||state!==expected||!verifier)throw new Error('GitHub authorization could not be verified. Please start again.');const redirectUri=new URL('oauth-callback.html',location.href).href;const r=await fetch(window.ADMIN_CONFIG.githubExchangeUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,code_verifier:verifier,redirect_uri:redirectUri})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.access_token)throw new Error(data.error||'GitHub sign-in could not be completed.');sessionStorage.removeItem('ve-oauth-state');sessionStorage.removeItem('ve-oauth-verifier');localStorage.setItem('ve-github-auth',JSON.stringify({...data,stored_at:Date.now()}));localStorage.setItem('ve-github-token',data.access_token);const returnTo=sessionStorage.getItem('ve-oauth-return')||'products.html';sessionStorage.removeItem('ve-oauth-return');location.replace(returnTo)}catch(e){$('status').textContent=e.message||'GitHub authorization failed.';}}
finish();
</script></body></html>
