<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Products — Vishwakarma Enterprises Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body><header class="topbar"><div class="brand"><div class="brand-mark">VE</div><div><strong>Vishwakarma Enterprises</strong><span>Catalogue Admin</span></div></div><div class="top-actions"><span id="connectionStatus" class="status-pill offline">Not connected</span><a href="index.html" class="ghost-btn">Dashboard</a></div></header><main class="admin-shell"><section class="page-head"><div><span class="eyebrow">PRODUCT CATALOGUE</span><h1>Manage Products</h1><p>Add products, edit details, replace images, and mark popular items.</p></div><button id="newProductBtn" class="primary-btn">＋ Add Product</button></section><section class="toolbar panel"><input id="searchInput" type="search" placeholder="Search product, brand or category…"><select id="categoryFilter"><option value="all">All categories</option><option value="plumbing">Plumbing</option><option value="water">Water Storage</option><option value="pumps">Pumps & Motors</option><option value="hardware">Hardware & Parts</option></select><label class="check"><input id="popularOnly" type="checkbox"> Popular only</label><button id="refreshBtn" class="ghost-btn">↻ Refresh</button></section><section class="stats-row"><div class="stat"><span>Total</span><strong id="totalCount">0</strong></div><div class="stat"><span>Popular</span><strong id="popularCount">0</strong></div><div class="stat"><span>Plumbing</span><strong id="plumbingCount">0</strong></div><div class="stat"><span>Other</span><strong id="otherCount">0</strong></div></section><section id="productsGrid" class="products-grid"></section><div id="emptyState" class="empty-state panel" hidden><strong>No products found</strong><span>Try another search or add your first product.</span></div></main><dialog id="productDialog" class="product-dialog"><form id="productForm" method="dialog"><div class="dialog-head"><div><span class="eyebrow">PRODUCT EDITOR</span><h2 id="dialogTitle">Add Product</h2></div><button type="button" class="icon-btn" id="closeDialog">×</button></div><div class="form-grid"><label>Product ID<input id="productId" required maxlength="50" placeholder="P001"></label><label>Brand<input id="brand" maxlength="80" placeholder="Supreme"></label><label>Hindi name<input id="nameHi" required maxlength="120" placeholder="PVC पाइप"></label><label>English name<input id="nameEn" required maxlength="120" placeholder="PVC Pipe"></label><label>Category<select id="category" required><option value="plumbing">Plumbing</option><option value="water">Water Storage</option><option value="pumps">Pumps & Motors</option><option value="hardware">Hardware & Parts</option></select></label><label>Sizes / variants<input id="sizes" placeholder="1/2 inch, 3/4 inch, 1 inch"></label><label class="full">Hindi description<textarea id="descriptionHi" rows="4" placeholder="उत्पाद का विवरण लिखें..."></textarea></label><label class="full">English description<textarea id="descriptionEn" rows="4" placeholder="Write the product description..."></textarea></label><label class="full upload-box"><span>Product image</span><input id="imageInput" type="file" accept="image/*"><small id="imageHint">Photo will be resized before upload.</small><img id="imagePreview" alt="Preview" hidden></label><label class="check full"><input id="featured" type="checkbox"> Show this product in <strong>Popular Products</strong></label></div><div class="dialog-foot"><button type="button" class="ghost-btn" id="cancelBtn">Cancel</button><button class="primary-btn" type="submit" id="saveBtn">Save Product</button></div></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="admin-config.js"></script><script src="admin.js"></script></body></html>
