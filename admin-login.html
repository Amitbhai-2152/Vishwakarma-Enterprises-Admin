<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login — Vishwakarma Enterprises</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.login-wrap{max-width:520px;margin:9vh auto}.login-card{padding:34px}.field{display:grid;gap:8px;margin:20px 0}.field label{font-size:13px;font-weight:700}.field input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #dfe5ec;border-radius:12px;font:15px Poppins,sans-serif}.field input:focus{outline:0;border-color:#c62828;box-shadow:0 0 0 3px rgba(198,40,40,.08)}.login-btn{width:100%;min-height:46px}.error{min-height:20px;color:#b42318;font-size:13px;margin-top:12px}.hint{font-size:12px;color:#667085;line-height:1.6;margin-top:14px}</style></head><body><main class="shell login-wrap"><section class="card login-card"><span class="eyebrow">PRIVATE ADMIN</span><h1>Admin Password</h1><p>Enter the admin password to continue to the Vishwakarma Enterprises control panel.</p><form id="loginForm"><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus placeholder="Enter admin password"></div><button class="primary-btn login-btn" id="loginBtn">Continue</button><div id="error" class="error" role="alert"></div></form><div class="hint">You will stay signed in for 7 days on this browser, so you normally will not need to enter the password again.</div></section></main><script>
const AUTH='ve-admin-password-token';const params=new URLSearchParams(location.search);const returnTo=['index.html','products.html','setup.html'].includes(params.get('return'))?params.get('return'):'index.html';
const $=id=>document.getElementById(id);
(async()=>{const token=localStorage.getItem(AUTH);if(!token)return;try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',token})});const d=await r.json();if(d.ok)location.replace(returnTo)}catch{}})();
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginBtn');const err=$('error');btn.disabled=true;btn.textContent='Checking…';err.textContent='';try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.error||'Login failed.');localStorage.setItem(AUTH,d.token);location.replace(returnTo)}catch(ex){err.textContent=ex.message||'Could not sign in.';btn.disabled=false;btn.textContent='Continue';$('password').focus()}});
</script></body></html>
